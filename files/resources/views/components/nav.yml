# The visual editor's contract for components/nav.blade.php — these fields
# surface under the Layout tab. Field names are camelCase, matching the props
# they fill.
title: Masthead
description: The inverse service row, the wordmark flanked by the menu box and the follow rail, the desk navigation with mega panels, and the left drawer
fields:
    brand:
        type: text
        label: Brand name
        description: Used for accessible labels — the nameplate itself is the wordmark in components/logo.blade.php.
        default: "Newspaper"
    tagline:
        type: text
        label: Motto
        description: The small-caps line under the wordmark. Keep it short — it prints on a single line.
        default: "A news and magazine template for your next project"
    edition:
        type: text
        label: Edition
        default: "Vol. I — No. 47"
    dateline:
        type: text
        label: Dateline
        default: "Saturday, July 26, 2026"
    ctaText:
        type: text
        label: Button text
        default: "Subscribe"
    ctaLink:
        type: url
        label: Button link
        default: "/#newsletter"
    newsletterText:
        type: text
        label: Service-row link text
        default: "The Early Edition ↗"
    socialLabel:
        type: text
        label: Follow label
        description: The small-caps word printed before the social icons.
        default: "Follow"
    social:
        type: repeater
        label: Social links
        source: site.social_links
        add_button_label: "Add social link"
        item_label: text
        sub_fields:
            text:
                type: text
                label: Name
                description: Used as the link's accessible label.
                default: "X"
            url:
                type: url
                label: Link
                default: "#"
            icon:
                type: textarea
                label: Icon SVG
                description: "Inline SVG. Use fill='currentColor' so it inverts with the square on hover."
                rows: 3
                default: ""
    megaLinkText:
        type: text
        label: Mega panel link text
        description: The "view everything" link inside each desk's dropdown.
        default: "All coverage"
    links:
        type: repeater
        label: Desk links
        source: site.nav_links
        add_button_label: "Add link"
        item_label: text
        sub_fields:
            text:
                type: text
                label: Text
                default: "New link"
            url:
                type: url
                label: Link
                default: "/"
