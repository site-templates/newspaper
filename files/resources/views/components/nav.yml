# The visual editor's contract for components/nav.blade.php — these fields
# surface under the Layout tab. Field names are camelCase, matching the props
# they fill.
title: Masthead
description: The inverse service row, the wordmark with menu box and header ad, the desk navigation with mega panels, and the left drawer
fields:
    brand:
        type: text
        label: Brand name
        description: Used for accessible labels — the nameplate itself is the wordmark in components/logo.blade.php.
        default: "Newspaper"
    tagline:
        type: text
        label: Motto
        description: The small-caps line under the wordmark. Keep it short — it prints on a single line.
        default: "A news and magazine template for your next project"
    edition:
        type: text
        label: Edition
        default: "Vol. I — No. 47"
    dateline:
        type: text
        label: Dateline
        default: "Saturday, July 26, 2026"
    ctaText:
        type: text
        label: Button text
        default: "Subscribe"
    ctaLink:
        type: url
        label: Button link
        default: "/#newsletter"
    newsletterText:
        type: text
        label: Service-row link text
        default: "The Early Edition ↗"
    adLabel:
        type: text
        label: Ad slot caption
        description: The small line printed above the header advertisement.
        default: "Advertisement"
    adEyebrow:
        type: text
        label: Ad eyebrow
        default: "The Early Edition"
    adHeading:
        type: text
        label: Ad headline
        default: "Our best reporting, in your inbox every Saturday."
    adCtaText:
        type: text
        label: Ad link text
        default: "Sign up free"
    adLink:
        type: url
        label: Ad link
        default: "/#newsletter"
    megaLinkText:
        type: text
        label: Mega panel link text
        description: The "view everything" link inside each desk's dropdown.
        default: "All coverage"
    links:
        type: repeater
        label: Desk links
        source: site.nav_links
        add_button_label: "Add link"
        item_label: text
        sub_fields:
            text:
                type: text
                label: Text
                default: "New link"
            url:
                type: url
                label: Link
                default: "/"
