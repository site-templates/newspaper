title: Lead package
description: The broadsheet front page — lead story center, secondary column left, Most Read right. Stories come from the articles collection.
fields:
    anchor:
        type: text
        label: Anchor id
        description: Lets navigation links jump to this section.
        default: "top"
    mostReadHeading:
        type: text
        label: Right column heading
        default: "Most Read"
    items:
        type: repeater
        label: Stories
        description: "The first story is the lead, the next two fill the left column, the rest become Most Read."
        source: articles
        add_button_label: "Add story"
        item_label: title
        sub_fields:
            title:
                type: text
                label: Headline
                default: "A new story"
            excerpt:
                type: textarea
                label: Excerpt
                rows: 3
                default: ""
            category:
                type: text
                label: Desk
                default: "News"
            categoryUrl:
                type: url
                label: Desk link
                default: "/articles"
            author:
                type: text
                label: Author
                default: ""
            authorRole:
                type: text
                label: Author role
                default: ""
            authorImage:
                type: image
                label: Author photo
                default: ""
            date:
                type: text
                label: Date
                default: ""
            readTime:
                type: text
                label: Read time
                default: ""
            link:
                type: url
                label: Story link
                default: "/articles"
            image:
                type: image
                label: Photograph
                default: ""
            imageAlt:
                type: text
                label: Photo caption
                default: ""
