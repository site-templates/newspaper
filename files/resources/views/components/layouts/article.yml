# Field labels for the story layout's chrome. Each story page passes these as
# attributes on its x-layouts.article tag; the body itself is authored markup.
title: Story layout
description: The shared chrome around a story — desk, headline, standfirst, byline, photograph, and the same-desk footer
fields:
    title:
        type: text
        label: Headline
        default: ""
    standfirst:
        type: textarea
        label: Standfirst
        description: Shown under the headline and used as the meta description.
        rows: 3
        default: ""
    category:
        type: text
        label: Desk
        default: "News"
    categoryUrl:
        type: url
        label: Desk link
        default: "/articles"
    author:
        type: text
        label: Author
        default: ""
    authorRole:
        type: text
        label: Author role
        default: ""
    authorImage:
        type: image
        label: Author photo
        default: ""
    date:
        type: text
        label: Date
        default: ""
    readTime:
        type: text
        label: Read time
        default: ""
    image:
        type: image
        label: Photograph
        description: Leave empty to publish without a lead photograph.
        default: ""
    imageAlt:
        type: text
        label: Photo caption
        default: ""
    credit:
        type: text
        label: Photo credit
        default: ""
    dropcap:
        type: toggle
        label: Opening drop cap
        default: "1"
